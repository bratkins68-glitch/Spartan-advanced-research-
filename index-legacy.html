<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>Spartan Advanced Research — Catalog</title>
<style>
:root{--bg:#0a0a0a;--panel:#151515;--line:#2a2a2a;--text:#f5f5f5;--muted:#a9a9a9;--accent:#d9d9d9}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:2;background:rgba(10,10,10,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:18px 20px}
.brand{max-width:1180px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:18px}
.logo strong{display:block;font-size:20px;letter-spacing:.12em}
.logo small{color:var(--muted);letter-spacing:.22em;font-size:10px}
.search{width:min(360px,48vw);background:#111;border:1px solid #333;border-radius:12px;padding:11px 14px;color:white;font-size:16px}
main{max-width:1180px;margin:auto;padding:34px 20px 60px}
.hero{padding:14px 0 30px}
.eyebrow{font-size:12px;letter-spacing:.2em;color:var(--muted);font-weight:700}
h1{font-size:clamp(34px,7vw,62px);line-height:1;margin:8px 0 12px}
.hero p{color:var(--muted);max-width:720px;font-size:17px;line-height:1.5}
.meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.pill{border:1px solid var(--line);border-radius:999px;padding:8px 11px;color:#ccc;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.card{background:linear-gradient(180deg,#171717,#111);border:1px solid var(--line);border-radius:18px;padding:18px;min-height:300px;display:flex;flex-direction:column}
.vial{height:150px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;position:relative;filter:drop-shadow(0 10px 12px rgba(0,0,0,.28))}
.cap{width:58px;height:22px;background:linear-gradient(90deg,#aaa 0%,#f7f7f7 18%,#bdbdbd 48%,#f4f4f4 72%,#999 100%);border-radius:7px 7px 3px 3px;border:1px solid #777;box-shadow:inset 0 3px 0 rgb[...]
.cap:after{content:"";position:absolute;left:8px;right:8px;top:4px;height:4px;border-top:1px solid rgba(0,0,0,.3);border-bottom:1px solid rgba(255,255,255,.6)}
.bottle{width:74px;height:100px;margin-top:-1px;background:linear-gradient(90deg,rgba(195,205,210,.7) 0%,rgba(255,255,255,.96) 21%,rgba(232,238,240,.78) 58%,rgba(180,190,195,.75) 100%);border:1px [...]
.bottle:before{content:"";position:absolute;top:4px;left:8px;width:12px;height:74px;border-radius:9px;background:linear-gradient(90deg,rgba(255,255,255,.05),rgba(255,255,255,.85),rgba(255,255,255,[...]
.bottle:after{content:"";position:absolute;left:9px;right:9px;bottom:5px;height:5px;border-radius:50%;background:rgba(80,90,95,.12)}
.bottle-label{width:62px;height:70px;background:#fff;border:1px solid #111;border-radius:3px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;box-sizing:border-box;[...]
.label-top{width:100%;background:#111;color:#fff;text-align:center;font-size:6px;font-weight:800;letter-spacing:.14em;padding:4px 1px 3px}
.label-mark{width:25px;height:25px;border-radius:50%;background:#111;display:flex;align-items:center;justify-content:center;margin:4px 0 2px;box-shadow:0 0 0 1px #111,0 0 0 2px #fff,0 0 0 3px #111[...]
.label-mark svg{width:18px;height:18px;fill:#fff}
.label-product{font-size:6.2px;font-weight:900;letter-spacing:.02em;text-transform:uppercase;max-width:57px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.label-strength{font-size:5.2px;font-weight:700;margin-top:2px}
.label-bottom{margin-top:auto;width:100%;background:#111;color:#fff;text-align:center;font-size:4.3px;font-weight:700;letter-spacing:.08em;padding:3px 1px 2px}
.info{margin-top:auto}
h3{margin:0 0 5px;font-size:18px}
.strength{color:var(--muted);font-size:14px}
.price{font-size:28px;font-weight:800;margin-top:12px}
.stock{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.stock strong{color:#ddd;font-weight:600}
.note{margin-top:8px;font-size:12px;color:#bbb}
footer{border-top:1px solid var(--line);color:var(--muted);padding:22px 20px;text-align:center;font-size:12px}
.empty{display:none;color:var(--muted);padding:30px 0}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.brand{align-items:flex-start;flex-direction:column}.search{width:100%}.grid{grid-template-columns:1fr 1fr;gap:10px}.card{padding:13px;min-height:260px}.vial{height:110px}h[...]


.product-photo{width:100%;height:150px;object-fit:contain;display:block;filter:drop-shadow(0 10px 12px rgba(0,0,0,.28));border-radius:10px}
@media(max-width:520px){.product-photo{height:110px}}

.order-btn{margin-top:12px;width:100%;border:1px solid #e7e7e7;background:#f5f5f5;color:#111;border-radius:10px;padding:11px 12px;font-weight:800;cursor:pointer}
.order-btn.added{background:#1f1f1f;color:#fff;border-color:#555}
.request-bar{position:fixed;left:12px;right:12px;bottom:12px;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:12px;background:rgba(18,18,18,.97);border:1px solid #3a3a3a[...]
.request-bar button{border:0;border-radius:9px;padding:10px 14px;font-weight:800;cursor:pointer}
.request-section{max-width:980px;margin:28px auto 90px;padding:22px;background:#121212;border:1px solid #2d2d2d;border-radius:18px}
.request-section h2{margin:0 0 8px}.request-section p{color:#aaa}.request-items{display:grid;gap:8px;margin:18px 0}.request-row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-item[...]


.details-hint{font-size:11px;color:#8f8f8f;margin:0 0 8px;letter-spacing:.03em}.card{cursor:pointer;transition:transform .15s ease,border-color .15s ease}.card:hover,.card:focus{border-color:#555;[...]
.product-modal{display:none;position:fixed;inset:0;z-index:100}.product-modal.open{display:block}.modal-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.76);backdrop-filter:blur(4px)}.mod[...]

.order-confirmation{display:none;max-width:760px;margin:70px auto 120px;padding:34px 24px;text-align:center;background:#121212;border:1px solid #343434;border-radius:20px}
.order-confirmation.show{display:block}.order-confirmation .checkmark{width:72px;height:72px;margin:0 auto 18px;border:2px solid #eee;border-radius:50%;display:flex;align-items:center;justify-cont[...]
@media(max-width:650px){.modal-card{grid-template-columns:1fr;gap:6px;margin:3vh auto;padding:18px;max-height:94vh}.modal-vial{min-height:180px}.modal-vial img{height:190px}.modal-copy{padding:0}.[...]

.card,.order-btn,.modal-add,[data-close-modal]{touch-action:manipulation;-webkit-tap-highlight-color:rgba(255,255,255,.08)}

/* 18+ age verification gate */
.age-gate{position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.97);display:flex;align-items:center;justify-content:center;padding:22px}
.age-gate.hidden{display:none}
.age-box{width:min(520px,100%);background:#151515;border:1px solid #3a3a3a;border-radius:22px;padding:30px 24px;text-align:center;box-shadow:0 24px 80px rgba(0,0,0,.55)}
.age-mark{font-size:13px;letter-spacing:.22em;color:#aaa;font-weight:700;margin-bottom:10px}
.age-box h2{font-size:32px;margin:6px 0 10px}
.age-box p{color:#bbb;line-height:1.55;margin:0 auto 20px;max-width:430px}
.age-check{display:flex;align-items:flex-start;gap:12px;text-align:left;background:#0e0e0e;border:1px solid #333;border-radius:14px;padding:15px;margin:18px 0}
.age-check input{width:22px;height:22px;margin:1px 0 0;accent-color:#fff;flex:0 0 auto}
.age-check label{color:#f2f2f2;line-height:1.4;font-weight:600;cursor:pointer}
.age-enter{width:100%;border:0;border-radius:13px;padding:14px 18px;font-size:16px;font-weight:800;background:#f2f2f2;color:#111;cursor:pointer}
.age-enter:disabled{opacity:.35;cursor:not-allowed}
.age-note{font-size:12px!important;color:#858585!important;margin-top:14px!important}
body.age-locked{overflow:hidden}
body:has(#ageConfirm:checked) .age-gate{display:none!important}
body:has(#ageConfirm:checked){overflow:auto!important}
</style>

<style id="spartan-calculator-styles">
.calc-section{margin:12px 0 34px;padding:24px;background:linear-gradient(180deg,#171717,#111);border:1px solid var(--line);border-radius:20px}
.calc-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:18px}.calc-head h2{margin:5px 0 6px;font-size:28px}.calc-head p{margin:0;color:va[...]
.calc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.calc-field{min-width:0}.calc-field label{display:block;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppe[...]
@media(max-width:760px){.calc-grid,.calc-results{grid-template-columns:1fr}.calc-section{padding:18px}.calc-head h2{font-size:24px}}
</style>

</head>

      <input id="ageConfirm" type="checkbox"/>
      <label for="ageConfirm">I confirm that I am 18 years of age or older.</label>
    </div>
    <p class="age-note">Check the box above and the catalog will open immediately.</p>
  </div>
</div>
